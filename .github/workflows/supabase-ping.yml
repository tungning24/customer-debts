name: Ping Supabase to Keep Alive

on:
  schedule:
    # รันทุก ๆ 4 วัน เวลาเที่ยงคืน
    - cron: '0 0 */2 * *'
  workflow_dispatch: # ให้กดปุ่มรันมือเองจากหน้า GitHub ได้

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase Database Table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -i -X PATCH "${SUPABASE_URL}/rest/v1/customers?id=eq.d81f975e-423c-44cc-ade1-3d75ed61f6f1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"updated_at": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"}'