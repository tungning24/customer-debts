name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Update customer via direct Postgres connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "UPDATE public.customers SET note = to_char(now() at time zone 'utc', 'YYYY-MM-DD'), updated_at = (now() at time zone 'utc') WHERE id = 'd81f975e-423c-44cc-ade1-3d75ed61f6f1';"