name: Ping Supabase to Keep Alive

on:
  schedule:
    # รันทุก ๆ 4 วัน เวลาเที่ยงคืน
    - cron: '0 0 */2 * *'
  workflow_dispatch: # ให้กดปุ่มรันมือเองจากหน้า GitHub ได้

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Update Supabase Customer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          CURRENT_DATE=$(date -u +"%Y-%m-%d")
          CURRENT_TIME=$(date -u +"%Y-%m-%d %H:%M:%S.%6N+00")
          
          curl -i -X PATCH "${SUPABASE_URL}/rest/v1/customers?id=eq.d81f975e-423c-44cc-ade1-3d75ed61f6f1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"note\": \"$CURRENT_DATE\", \"updated_at\": \"$CURRENT_TIME\"}"